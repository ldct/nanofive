name = "tinyfive"
defaultTargets = ["TinyFive", "DecNumber", "Abc101a", "CountingPrimesSimple", "CountingPrimesSieve",
  "CountingPrimesWheel", "CountingPrimesOddSieve", "CountingPrimesLucy", "CountingPrimesOddWheel", "GrumpyGordon", "Urlh", "abc101a",
  "counting_primes_simple", "counting_primes_sieve", "counting_primes_wheel",
  "counting_primes_odd_sieve", "counting_primes_lucy", "counting_primes_odd_wheel", "counting_primes_grumpygordon"]

# Shared: the machine model and lemmas more than one project uses.
[[lean_lib]]
name = "TinyFive"
srcDir = "lean"

# One library per project, with its proofs in <project>/lean.
[[lean_lib]]
name = "Abc101a"
srcDir = "abc101a/lean"
roots = ["Abc101a"]

[[lean_lib]]
name = "CountingPrimesSimple"
srcDir = "counting_primes/simple/lean"
roots = ["CountingPrimes"]

[[lean_lib]]
name = "CountingPrimesSieve"
srcDir = "counting_primes/sieve/lean"
roots = ["CountingPrimesSieve", "SieveCost", "SieveCostBound"]

[[lean_lib]]
name = "CountingPrimesWheel"
srcDir = "counting_primes/wheel/lean"
roots = ["CountingPrimesWheel", "WheelMath"]

[[lean_lib]]
name = "CountingPrimesOddSieve"
srcDir = "counting_primes/odd_sieve/lean"
roots = ["CountingPrimesOddSieve", "OddSieveMath"]

[[lean_lib]]
name = "CountingPrimesLucy"
srcDir = "counting_primes/lucy/lean"
roots = ["CountingPrimesLucy", "LucyMath", "LucyMemory"]

[[lean_lib]]
name = "CountingPrimesOddWheel"
srcDir = "counting_primes/odd_wheel/lean"
roots = ["CountingPrimesOddWheel", "CountingPrimesOddWheelMachine", "OddWheelSetup",
  "OddWheelMath", "OddWheelCount", "OddWheelDivision", "OddWheelMarking", "OddWheelFive",
  "OddWheelLoops", "OddWheelBounds", "OddWheelFlags", "OddWheelCountAll",
  "OddWheelOuter", "OddWheelOuterInv", "OddWheelOuterLoop", "OddWheelSquares", "OddWheelMinus",
  "OddWheelPlus", "OddWheelPairBounds", "OddWheelFiveMem", "OddWheelFiveLoop", "OddWheelStartupMarks"]

[[lean_lib]]
name = "GrumpyGordon"
srcDir = "counting_primes/grumpygordon/lean"
roots = ["GrumpyGordon", "GrumpyResidual", "GrumpyTables", "GrumpyOdd"]

[[lean_lib]]
name = "Urlh"
srcDir = "urlh/lean"
roots = ["UrlDecode"]

[[lean_lib]]
name = "DecNumber"
srcDir = "decnumber/lean"
roots = ["DecContextClear", "DecNumber.Replay", "DecNumber.Image", "DecNumber.Bounded"]

# Executable models, run by the projects' tests.
[[lean_exe]]
name = "abc101a"
srcDir = "abc101a/lean"
root = "Abc101aMain"

[[lean_exe]]
name = "counting_primes_simple"
srcDir = "counting_primes/simple/lean"
root = "PrimeMain"

[[lean_exe]]
name = "counting_primes_sieve"
srcDir = "counting_primes/sieve/lean"
root = "SieveMain"

[[lean_exe]]
name = "counting_primes_wheel"
srcDir = "counting_primes/wheel/lean"
root = "WheelMain"

[[lean_exe]]
name = "counting_primes_odd_sieve"
srcDir = "counting_primes/odd_sieve/lean"
root = "OddSieveMain"

[[lean_exe]]
name = "counting_primes_lucy"
srcDir = "counting_primes/lucy/lean"
root = "LucyMain"

[[lean_exe]]
name = "counting_primes_odd_wheel"
srcDir = "counting_primes/odd_wheel/lean"
root = "OddWheelMain"

[[lean_exe]]
name = "counting_primes_grumpygordon"
srcDir = "counting_primes/grumpygordon/lean"
root = "GrumpyMain"

[[lean_exe]]
name = "decnumber_decode"
srcDir = "decnumber/lean"
root = "DecodeELF"
