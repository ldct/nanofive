name = "tinyfive"
defaultTargets = ["TinyFive", "DecNumber", "CountingPrimes", "Abc101a", "CountingPrimesTrialDivision",
  "CountingPrimesSieve", "CountingPrimesWheel", "CountingPrimesOddSieve", "CountingPrimesLucy",
  "CountingPrimesOddWheel", "GrumpyGordon", "Zjy2008", "Urlh", "TweetNaCl", "NaClSalsa20", "abc101a",
  "counting_primes_trial_division", "counting_primes_sieve", "counting_primes_wheel",
  "counting_primes_odd_sieve", "counting_primes_lucy", "counting_primes_odd_wheel",
  "counting_primes_grumpygordon"]

# Shared: the machine model and lemmas more than one project uses.
[[lean_lib]]
name = "TinyFive"
srcDir = "lean"

# One library per project, with its proofs in <project>/lean.
[[lean_lib]]
name = "Abc101a"
srcDir = "abc101a/lean"
roots = ["Abc101a"]

# The correctness definition shared by every counting-primes program, and the audited
# statement of every program's result.
[[lean_lib]]
name = "CountingPrimes"
srcDir = "counting_primes/lean"
roots = ["ForHumans.Spec", "ForHumans.Results", "ForHumans.Smallest", "CountingPrimesLoad"]

[[lean_lib]]
name = "CountingPrimesTrialDivision"
srcDir = "counting_primes/trial_division/lean"
roots = ["TrialDivisionProgram", "CountingPrimesTrialDivision"]

[[lean_lib]]
name = "CountingPrimesSieve"
srcDir = "counting_primes/sieve/lean"
roots = ["SieveProgram", "CountingPrimesSieve", "SieveCost", "SieveCostBound"]

[[lean_lib]]
name = "CountingPrimesWheel"
srcDir = "counting_primes/wheel/lean"
roots = ["WheelProgram", "CountingPrimesWheel", "WheelMath"]

[[lean_lib]]
name = "CountingPrimesOddSieve"
srcDir = "counting_primes/odd_sieve/lean"
roots = ["OddSieveProgram", "CountingPrimesOddSieve", "OddSieveMath"]

[[lean_lib]]
name = "CountingPrimesLucy"
srcDir = "counting_primes/lucy/lean"
roots = ["LucyProgram", "CountingPrimesLucy", "LucyMath", "LucyMemory"]

[[lean_lib]]
name = "CountingPrimesOddWheel"
srcDir = "counting_primes/odd_wheel/lean"
roots = ["CountingPrimesOddWheel", "CountingPrimesOddWheelMachine", "OddWheelSetup",
  "OddWheelMath", "OddWheelCount", "OddWheelDivision", "OddWheelMarking", "OddWheelFive",
  "OddWheelLoops", "OddWheelBounds", "OddWheelFlags", "OddWheelCountAll",
  "OddWheelOuter", "OddWheelOuterInv", "OddWheelOuterLoop", "OddWheelSquares", "OddWheelMinus",
  "OddWheelPlus", "OddWheelPairBounds", "OddWheelFiveMem", "OddWheelFiveLoop", "OddWheelStartupMarks"]

[[lean_lib]]
name = "GrumpyGordon"
srcDir = "counting_primes/grumpygordon/lean"
roots = ["GrumpyGordon", "GrumpyResidual", "GrumpyTables", "GrumpyOdd", "GrumpyBinary.Program", "GrumpyBinary.Attr", "GrumpyBinary.Exec", "GrumpyBinary.Arith", "GrumpyBinary.Tactic", "GrumpyBinary.Newton", "GrumpyBinary.SkipMath", "GrumpyBinary.Memset", "GrumpyBinary.Layout", "GrumpyBinary.Init", "GrumpyBinary.Compact", "GrumpyBinary.Update", "GrumpyBinary.RoundMath", "GrumpyBinary.Round", "GrumpyBinary.Outer", "GrumpyBinary.Finish", "GrumpyBinary.FinishMath", "GrumpyBinary.FinishRun", "GrumpyBinary.Setup", "GrumpyBinary.Correct"]

[[lean_lib]]
name = "Zjy2008"
srcDir = "counting_primes/zjy2008/lean"
roots = ["ZjyBinary.Program", "ZjyBinary.Exec", "ZjyBinary.Tactic", "ZjyBinary.Mark", "ZjyBinary.Compact", "ZjyBinary.Update", "ZjyBinary.Calc"]

[[lean_lib]]
name = "Urlh"
srcDir = "urlh/lean"
roots = ["UrlDecode"]

[[lean_lib]]
name = "DecNumber"
srcDir = "decnumber/lean"
roots = ["DecContextClear", "DecNumber.Replay", "DecNumber.Image", "DecNumber.Bounded"]

[[lean_lib]]
name = "TweetNaCl"
srcDir = "tweetnacl/lean"
roots = ["TweetNaCl.ForHumans.Spec", "TweetNaCl.Verify32Program",
  "TweetNaCl.ForHumans.Salsa20Spec", "TweetNaCl.Salsa20Program",
  "TweetNaCl.Salsa20LowWords", "TweetNaCl.Salsa20Schedule",
  "TweetNaCl.Salsa20WideIO", "TweetNaCl.Salsa20Replay",
  "TweetNaCl.Salsa20Slots", "TweetNaCl.Salsa20Circuit",
  "TweetNaCl.Salsa20Symbolic", "TweetNaCl.Salsa20Reference", "TweetNaCl.Salsa20RefCert",
  "TweetNaCl.Salsa20Correct", "TweetNaCl.ForHumans.Salsa20Result",
  "TweetNaCl.Salsa20IOProgram", "TweetNaCl.ForHumans.Salsa20IOSpec", "TweetNaCl.Salsa20IO",
  "TweetNaCl.ForHumans.Salsa20IOResult"]

# NaCl 20110221's reference Salsa20 core, against the TweetNaCl Salsa20 specification.
[[lean_lib]]
name = "NaClSalsa20"
srcDir = "nacl/lean"
roots = ["NaClSalsa20.Program", "NaClSalsa20.Wire", "NaClSalsa20.WireSound",
  "NaClSalsa20.Symbolic", "NaClSalsa20.SymbolicSound", "NaClSalsa20.Reference",
  "NaClSalsa20.Call", "NaClSalsa20.IO", "NaClSalsa20.ForHumans.Salsa20Result",
  "NaClSalsa20.ForHumans.Salsa20IOResult"]

# Executable models, run by the projects' tests.
[[lean_exe]]
name = "abc101a"
srcDir = "abc101a/lean"
root = "Abc101aMain"

